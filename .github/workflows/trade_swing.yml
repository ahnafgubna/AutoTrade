name: AutoTrader Swing

on:
  # Triggered by cron-job.org at 3:45pm ET on weekdays. GitHub's own
  # `schedule` trigger fired ~2 hours late (after the close), so the bot
  # exited "outside market hours" every day and never traded.
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests tzdata

      - name: Run swing trading bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_SWING_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_SWING_API_SECRET }}
        run: python swing_main.py
